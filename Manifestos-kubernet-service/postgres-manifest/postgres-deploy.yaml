apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fiap-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: 245177908729.dkr.ecr.us-east-1.amazonaws.com/solidarytech/postgres:latest
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: OTEL_SERVICE_NAME
              value: "postgres"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: ENVIRONMENT
              value: "fiap-lab5"
          resources:
            requests:
              cpu: "10m"
            limits:
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fiap-microservices
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
