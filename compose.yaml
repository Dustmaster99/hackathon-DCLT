name: solidarytech

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      NGO_DB_NAME: ${NGO_DB_NAME}
      DONATION_DB_NAME: ${DONATION_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - ./ngo-service/db/init.sql:/schemas/ngo-init.sql:ro
      - ./donation-service/db/init.sql:/schemas/donation-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ngo-service:
    build:
      context: ./ngo-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${NGO_SERVICE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${NGO_DB_NAME}
    ports:
      - "${NGO_SERVICE_PORT}:${NGO_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  donation-service:
    build:
      context: ./donation-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${DONATION_SERVICE_PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${DONATION_DB_NAME}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_URL: ${AWS_SQS_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    ports:
      - "${DONATION_SERVICE_PORT}:${DONATION_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:$${PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  volunteer-service:
    build:
      context: ./volunteer-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${VOLUNTEER_SERVICE_PORT}
      AWS_REGION: ${AWS_REGION}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    ports:
      - "${VOLUNTEER_SERVICE_PORT}:${VOLUNTEER_SERVICE_PORT}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['PORT'] + '/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
